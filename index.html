<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Embodied Red Teaming</title>
<meta name="description" content="An open red-teaming arena for the foundation models that drive robots: LLM / VLM agents through code and skills, and vision-language-action policies end to end.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%230f141a'/%3E%3Crect x='8.8' y='22.6' width='10.4' height='3' rx='1.5' fill='%23f4f6f9'/%3E%3Crect x='12.1' y='10' width='3.8' height='12' fill='%23f4f6f9'/%3E%3Cpath d='M14 10L9.2 14.8' stroke='%23f4f6f9' stroke-width='3.5'/%3E%3Ccircle cx='14' cy='21.4' r='2.8' fill='%23f4f6f9'/%3E%3Ccircle cx='14' cy='10' r='2.8' fill='%23ff5a4f'/%3E%3Ccircle cx='22.5' cy='17.5' r='3.6' stroke='%23ff5a4f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/exam.css">
<link rel="stylesheet" href="assets/redteam.css">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ert-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="data/site.js"></script>
<script src="data/results.js"></script>
<script src="assets/app.js" defer></script>
</head>
<body data-page="home">
<div id="nav"></div>
<main>

  <section class="hero-wall" id="top">
    <div class="wall" id="wall" aria-hidden="true"></div>
    <div class="wall-veil"></div>
    <div class="wall-paper"></div>
    <div class="hero-main">
      <div class="hero-copy">
        <p class="hero-q"><span id="hero-q"></span> <em id="hero-q-em"></em></p>
        <h1 id="hero-h1"></h1>
        <p class="summary" id="hero-lead"></p>
        <div class="hero-run" id="hero-run"></div>
        <div class="cta">
          <a class="btn primary" href="#leaderboard">See the leaderboard <span class="arr">→</span></a>
          <a class="btn gh-start" data-gh>Get started</a>
          <a class="btn" href="#attacks">See an attack</a>
        </div>
      </div>
    </div>
    <a class="scroll-cue" href="#statement" aria-label="Scroll down">↓</a>
  </section>

  <section class="section numbers" id="statement">
    <dl class="bignums reveal" id="bignums"></dl>
  </section>

  <section class="section" id="leaderboard">
    <div class="head reveal">
      <h2>Leaderboard</h2>
    </div>
    <div class="lbh rt reveal" id="lbh"></div>
  </section>

  <section class="section" id="breaks">
    <div class="head reveal">
      <h2>Where they break</h2>
    </div>
    <div class="hm reveal" id="heatmap"></div>
  </section>

  <section class="section" id="attacks">
    <div class="head reveal">
      <h2>One task, five attacks</h2>
    </div>
    <div class="atk reveal" id="atk"></div>
  </section>

  <section class="section" id="scenarios">
    <div class="head reveal">
      <h2>The scenarios</h2>
    </div>
    <div class="galleries reveal" id="gallery"></div>
  </section>

  <section class="section" id="how">
    <div class="head reveal">
      <h2>The red-teaming loop</h2>
    </div>
    <figure class="loop reveal" id="loop"></figure>
    <div class="metrics reveal" id="metrics"></div>
    <div class="cways reveal" id="ways"></div>
    <div class="trust reveal">
      <p class="label">What keeps the numbers honest</p>
      <ul id="trust"></ul>
    </div>
  </section>

  <section class="section closing">
    <div class="closing-inner reveal">
      <h2>Bring an attack to the arena.</h2>
      <div class="cta">
        <a class="btn primary" data-gh>Submit an attack <span class="arr">→</span></a>
        <a class="btn" data-gh>Submit a model</a>
      </div>
    </div>
  </section>

</main>
<div id="footer"></div>
<div class="ph-badge" id="ph-badge" hidden></div>
</body>
</html>
