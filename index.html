<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embodied Red-Teaming — research project website.">
  <title>Embodied Red-Teaming</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
      color: #e8edf7; background: radial-gradient(circle at 70% 10%, #232b59 0, transparent 45%),
      radial-gradient(circle at 10% 85%, #182a43 0, transparent 40%), #0c1020; }
    main { width: min(100%, 850px); padding: clamp(32px, 7vw, 80px); border: 1px solid #343d60;
      border-radius: 24px; background: rgba(18, 25, 47, 0.75); box-shadow: 0 20px 80px #0004; }
    .tag { display: inline-block; margin-bottom: 26px; border: 1px solid #49557d; border-radius: 50px;
      padding: 8px 13px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #b5c9ff; }
    h1 { margin: 0; font-size: clamp(40px, 7vw, 76px); line-height: 1.08; letter-spacing: -.05em; }
    h1 span { color: #99b0ff; }
    p { margin: 25px 0 0; max-width: 540px; line-height: 1.7; font-size: 18px; color: #b8c5dd; }
    .rule { width: 56px; height: 4px; background: #91aafa; border-radius: 3px; margin: 38px 0 24px; }
    footer { font-size: 13px; color: #8291af; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Research Project Website</div>
    <h1>Embodied<br><span>Red-Teaming</span></h1>
    <p>Our project website is being prepared. Research details, results, and resources will be added here.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>Coming soon · Embodied Red-Teaming</footer>
  </main>
</body>
</html>
